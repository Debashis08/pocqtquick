# Ui changes
ui:
  - changed-files:
      - any-glob-to-any-file: 'src/ui/**'
      - any-glob-to-any-file: 'tests/ui/**'
      - any-glob-to-any-file: '*.qrc'
      - any-glob-to-any-file: '*.conf'

# Backend changes
backend:
  - changed-files:
      - any-glob-to-any-file: 'src/backend/**'
      - any-glob-to-any-file: 'tests/backend/**'

# Core Infrastructure changes
core:
  - changed-files:
      - any-glob-to-any-file: 'src/backend/core/**'

# Installer changes
installer:
  - changed-files:
      - any-glob-to-any-file: 'installer/**'

# Build system changes — fires ONLY when every changed file is a cmake file
build-system:
  - changed-files:
      - all-globs-to-all-files: '**/CMakeLists.txt'  # all files must be CMakeLists.txt
  - changed-files:
      - all-globs-to-all-files: '**/*.cmake'          # OR all files must be *.cmake

# Workflow changes
workflows:
  - changed-files:
      - any-glob-to-any-file: '.github/**'

# Documentation changes
documentation:
  - changed-files:
      - any-glob-to-any-file: '*.md'